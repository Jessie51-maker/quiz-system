/* ===== 顯示 ===== */
function renderQuiz(){
  const qDiv=document.getElementById("quiz");

  questions.forEach((q,i)=>{
    let html=`<div><h3>Q${q.id}. ${q.q}</h3>`;
    q.o.forEach(opt=>{
      const t=q.type==="multiple"?"checkbox":"radio";
      html+=`<label><input type="${t}" name="q${i}" value="${opt[0]}">${opt}</label><br>`;
    });
    html+="</div><hr>";
    qDiv.innerHTML+=html;
  });
}

/* ===== 判分 ===== */
function submitQuiz(){
  let score=0;

  questions.forEach((q,i)=>{
    const sel=[...document.querySelectorAll(`input[name=q${i}]:checked`)].map(e=>e.value).sort();
    const ans=q.a.slice().sort();

    if(JSON.stringify(sel)===JSON.stringify(ans)) score++;
  });

  document.getElementById("result").innerText=`得分：${score}/${questions.length}`;
}

renderQuiz();
</script>
