<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>測驗系統（支援複選）</title>
<style>
body { font-family: Arial; padding:20px; }
.question { margin-bottom:20px; }
.correct { color:green; }
.wrong { color:red; }
</style>
</head>
<body>

<h1>📘 題庫測驗（支援複選）</h1>

<form id="quizForm"></form>

<button onclick="submitQuiz()">提交答案</button>

<h2 id="result"></h2>

<script>

const quizData = [
{
q:"1. 可儲存哪些設定（複選）？",
options:["A 鍵盤","B 顏色","C 選單","D 管理員"],
answer:["A","C"]   // 👈複選
},
{
q:"2. 點陣圖基本單位？",
options:["A 點","B 像素","C 公分","D 公厘"],
answer:"B"  // 👈單選
}
];

const form = document.getElementById("quizForm");

quizData.forEach((q,i)=>{
let div = document.createElement("div");
div.classList.add("question");

let html = `<p>${q.q}</p>`;

q.options.forEach(opt=>{

// 判斷是否為複選
let type = Array.isArray(q.answer) ? "checkbox" : "radio";

html += `
<label>
<input type="${type}" name="q${i}" value="${opt[0]}">
${opt}
</label><br>`;
});

div.innerHTML = html;
form.appendChild(div);
});

function submitQuiz(){
let score = 0;

quizData.forEach((q,i)=>{

let selected = document.querySelectorAll(`input[name="q${i}"]:checked`);
let values = Array.from(selected).map(el=>el.value);

// 單選
if(!Array.isArray(q.answer)){
if(values[0] === q.answer){
score++;
}
}

// 複選（完全一致才算對）
else{
let correct = q.answer.sort().join("");
let user = values.sort().join("");

if(correct === user){
score++;
}
}

});

document.getElementById("result").innerText =
`你的分數：${score} / ${quizData.length}`;
}

</script>

</body>
</html>
