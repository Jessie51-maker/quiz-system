<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>題庫練習</title>
<style>
body { font-family: Arial; padding: 20px; }
.question { margin-bottom: 25px; padding: 10px; border: 1px solid #ccc; }
.option { cursor: pointer; margin: 5px 0; padding: 5px; }
.option:hover { background: #eee; }
.correct { background: #c8f7c5; }
.wrong { background: #f7c5c5; }
.explain { margin-top: 10px; color: #333; }
button { margin-top: 20px; padding: 10px 20px; }
</style>
</head>

<body>

<h1>題庫練習</h1>
<div id="quiz"></div>
<button onclick="location.reload()">重新練習</button>

<script>
const data = [
/* ===================== Photoshop 題庫 ===================== */
{
q:"1. 為了方便不同類型檔案切換不同工作區，除了利用上方的「工作區切換器」中選取預設的工作區之外，還可以從哪裡切換?",
options:["檔案>建立新檢閱","視窗>延伸功能>CS Review","視窗>工作區","檢視>螢幕模式"],
answer:[2],
explain:"透過「視窗 > 工作區」切換"
},
{
q:"3. 「新增工作區域」可以儲存哪些設定(選二)?",
options:["鍵盤快速鍵","顏色設定","選單","預設集管理員"],
answer:[0,2],
explain:"可儲存鍵盤與選單"
},
{
q:"19. 以下對於參考線的描述哪些不正確(選二)?",
options:["不可移動","不可改顏色","可輸入數值","可清除"],
answer:[0,1],
explain:"參考線可移動也可改顏色"
},
{
q:"23. 色版描述哪些錯誤(選二)?",
options:["會變黑白","不可製作濾鏡","不可載入選取","RGB預設"],
answer:[1,2],
explain:"色版可套濾鏡也可載入"
},
{
q:"32. 可用於網路的影像格式(選三)?",
options:["GIF","JPG","PNG","PSD"],
answer:[0,1,2],
explain:"PSD不適合網頁"
},
{
q:"39. 關於色彩哪些正確(選三)?",
options:["RGB是三原色","互補色產生對比","互補色由原色混合","相似色相鄰"],
answer:[0,1,3],
explain:"互補色不是原色混合"
},
{
q:"43. 設計專案關鍵因素(選二)?",
options:["客戶目標","目標客戶","設計趨勢","季節","風格"],
answer:[0,1],
explain:"以客戶與受眾為主"
},
{
q:"48. 設計原理(選三)?",
options:["重複","調和","留白","統一"],
answer:[0,1,3],
explain:"留白不是原理分類"
},
{
q:"49. Photoshop 專案必要細節(選二)?",
options:["範圍","合約","時間","廣告"],
answer:[0,2],
explain:"範圍與時程必要"
},
{
q:"50. 起始階段交付項目(選二)?",
options:["草稿","規格","程式","回應","分析"],
answer:[0,1],
explain:"初期為概念與規格"
},
{
q:"51. 設計師責任(選二)?",
options:["預算","影像處理","分析","範例"],
answer:[1,3],
explain:"設計師負責影像與示意"
},
{
q:"53. 生產階段責任(選二)?",
options:["預算","影像處理","分析","範例"],
answer:[1,3],
explain:"與實作相關"
},
{
q:"58. 色彩正確敘述(選三)?",
options:["RGB","互補色對比","互補混合","類似色相鄰","類似對立"],
answer:[0,1,3],
explain:"互補不是混合"
},
{
q:"65. 設計影響因素(選二)?",
options:["客戶","趨勢","對象","季節","風格"],
answer:[0,2],
explain:"同43題"
},

/* ===================== 硬體 ===================== */
{
q:"1. 條碼屬於?",
options:["輸入設備","輸入媒體","輸出設備","輸出媒體"],
answer:[1],
explain:"條碼是資料媒體"
},
{
q:"2. CPU敘述錯誤?",
options:["CU控制","IO運算","ALU運算","記憶體儲存"],
answer:[1],
explain:"運算是ALU"
},

/* ===================== 網路 ===================== */
{
q:"1. Internet標準機構?",
options:["IETF","IEEE","ANSI","ISO"],
answer:[0],
explain:"IETF負責網路標準"
},
{
q:"7. 協定錯誤?",
options:["TCP可靠","HTTP安全","HTTP用TCP","UDP不可靠"],
answer:[1],
explain:"HTTP不是安全協定"
},

/* ===================== 資安 ===================== */
{
q:"1. 電腦犯罪錯誤?",
options:["容易察覺","隱密","高技術","不同"],
answer:[0],
explain:"通常不易察覺"
},
{
q:"5. 加密錯誤?",
options:["對稱快","非對稱安全","RSA對稱","有公私鑰"],
answer:[2],
explain:"RSA是非對稱"
}
];

/* ===================== 渲染 ===================== */
const quiz = document.getElementById("quiz");

data.forEach((item, index) => {
  const div = document.createElement("div");
  div.className = "question";

  const title = document.createElement("h3");
  title.innerText = item.q;
  div.appendChild(title);

  const selected = new Set();

  item.options.forEach((opt, i) => {
    const btn = document.createElement("div");
    btn.className = "option";
    btn.innerText = opt;

    btn.onclick = () => {
      if(item.answer.length > 1){
        if(selected.has(i)) selected.delete(i);
        else selected.add(i);
      }else{
        selected.clear();
        selected.add(i);
      }

      // reset
      div.querySelectorAll(".option").forEach(o=>o.classList.remove("correct","wrong"));

      // show result
      div.querySelectorAll(".option").forEach((o, idx)=>{
        if(item.answer.includes(idx)) o.classList.add("correct");
        if(selected.has(idx) && !item.answer.includes(idx)) o.classList.add("wrong");
      });

      // explain
      if(!div.querySelector(".explain")){
        const exp = document.createElement("div");
        exp.className="explain";
        exp.innerText="解析："+item.explain;
        div.appendChild(exp);
      }
    };

    div.appendChild(btn);
  });

  quiz.appendChild(div);
});
</script>

</body>
</html>
